<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Parsec &amp; Co</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Vollkorn:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --nuit: #121a3d; --nuit-2: #0c1230; --papier: #f1e2bc; --creme: #f4e9cf; --orange: #ef9b4f;
    --eau: #8fd3c4; --lavande: #b9aae8; --rose: #e8a99a; --encre: #1b2451; --encre-douce: #46507e;
    --trame: radial-gradient(rgba(27,36,81,0.07) 1px, transparent 1.5px) 0 0 / 6px 6px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root { color-scheme: light; --carte: #efe6d2; --sepia: #3b2a1e; --sepia-doux: #6b5a48; --brique: #b5523b; --vdg: #3f8f80; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    margin: 0; height: 100%; overflow: hidden; background: var(--carte); color: var(--sepia);
    font-family: "Vollkorn", Georgia, "Times New Roman", serif;
    touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* en-tête : un bandeau de parchemin, double filet et trait orange mal calé */
  .hud { position: fixed; left: 0; right: 0; top: 0; z-index: 3; padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px; background: radial-gradient(rgba(59,42,30,0.13) 1px, transparent 1.5px) 0 0 / 5px 5px, linear-gradient(#e2c995, #d8bc84);
    border-bottom: 1.5px solid var(--sepia); box-shadow: 0 3px 0 var(--carte), 0 4.5px 0 var(--sepia), 0 7.5px 0 rgba(239,155,79,0.7); }
  .identite { min-width: 0; }
  .marque { font-family: "Bowlby One", "Arial Black", Impact, sans-serif; font-size: 12px; letter-spacing: 0.05em; color: var(--brique); text-shadow: 1px 1px 0 var(--rose); }
  .nom { font-family: "Bowlby One", "Arial Black", Impact, sans-serif; font-size: clamp(20px, 6.2vw, 27px); line-height: 1.08; margin-top: 2px; color: var(--encre); text-shadow: 2px 2px 0 var(--rose); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .titre { font-size: 15px; font-style: italic; color: var(--brique); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .releve { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; font-size: 13px; font-style: italic; line-height: 1.3; color: var(--sepia-doux); margin-bottom: 10px; font-variant-numeric: lining-nums tabular-nums; }
  .releve span span, .releve b { color: var(--sepia); font-weight: 700; font-style: normal; }
  .echelle { flex-shrink: 0; text-align: right; font-style: italic; color: var(--sepia); }
  .echelle i { display: block; height: 4px; border: 1px solid var(--sepia); border-top: 0; margin: 0 0 2px auto; }
  .xp { height: 4px; border: 1px solid var(--sepia); margin: 8px 0 6px; }
  .xp i { display: block; height: 100%; background: var(--vdg); }
  .onglets { display: grid; grid-template-columns: repeat(3, 1fr); }
  .onglets button { border-radius: 0; box-shadow: none; background: transparent; padding: 7px 4px; font-size: 16px; font-style: italic; border-right-width: 0; }
  .onglets button:last-child { border-right-width: 1.5px; }
  .onglets button:active { background: rgba(239,155,79,0.35); transform: none; }
  .onglets button .pastille { display: inline-block; min-width: 18px; margin-left: 6px; padding: 0 5px; border-radius: 9px; background: var(--sepia); color: var(--carte); font-style: normal; font-size: 12px; line-height: 18px; text-align: center; }
  .ico { width: 1.1em; height: 1.1em; vertical-align: -0.2em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; margin-right: 0.3em; flex-shrink: 0; }
  .marque .ico { margin-right: 0.25em; }
  .colonne .ico { display: block; margin: 0 auto 2px; width: 18px; height: 18px; }
  .tuile .ico { width: 14px; height: 14px; margin: 0 0 2px; opacity: 0.75; }
  /* en bas : le message et l’action */
  .bas { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; flex-direction: column; gap: 10px; }
  .action { width: 100%; font-size: 19px; padding: 12px 14px; }
  /* boutons : trait d’encre fin, ombre de couleur mal calée */
  button { font: 700 16px "Vollkorn", Georgia, serif; color: var(--encre); background: var(--papier); border: 1.5px solid var(--encre); border-radius: 4px; padding: 9px 14px; box-shadow: 3px 3px 0 var(--rose); cursor: pointer; }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--rose); }
  button:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
  button.second { background: var(--eau); }
  button.ping { background: var(--orange); font-style: italic; }
  button[disabled] { opacity: 0.5; cursor: default; }
  /* le papier : une case de bande dessinée */
  .papier { background: var(--trame), var(--papier); color: var(--encre); border: 1.5px solid var(--encre); border-radius: 3px; padding: 11px 14px; box-shadow: 4px 4px 0 var(--orange); font-size: 16px; line-height: 1.4; transform: rotate(-0.4deg); }
  .papier b { font-family: "Bowlby One", "Arial Black", Impact, sans-serif; font-weight: 400; font-size: 17px; letter-spacing: 0.01em; }
  .papier.cache { display: none; }
  .papier button { margin-top: 10px; margin-right: 6px; font-size: 15px; padding: 7px 12px; }
  /* la page de magazine */
  .fiche { position: fixed; inset: 0; background: rgba(40,28,16,0.5); display: flex; align-items: flex-end; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 5; }
  .fiche.cache { display: none; }
  .fiche .page { background: var(--trame), var(--papier); color: var(--encre); border: 1.5px solid var(--encre); border-radius: 4px; width: 100%; max-width: 520px; max-height: 100%; overflow-y: auto; box-shadow: 6px 6px 0 var(--orange); transform: rotate(0.5deg); overscroll-behavior: contain; }
  .fiche .mast { display: flex; justify-content: space-between; align-items: baseline; background: var(--encre); color: var(--papier); padding: 6px 14px 5px; }
  .fiche .mast span:first-child { font-family: "Bowlby One", "Arial Black", Impact, sans-serif; font-size: 13px; letter-spacing: 0.04em; color: var(--orange); }
  .fiche .mast span:last-child { font-style: italic; font-size: 14px; }
  .fiche .image { height: 36vh; min-height: 190px; position: relative; overflow: hidden; border-bottom: 1.5px solid var(--encre); }
  .fiche .image canvas { position: static; width: 100%; height: 100%; }
  .fiche .manchette { position: absolute; left: 14px; bottom: 14px; background: var(--orange); color: var(--encre); font-family: "Bowlby One", "Arial Black", Impact, sans-serif; font-size: 14px; padding: 5px 11px 4px; transform: rotate(-3deg); border: 1.5px solid var(--encre); box-shadow: 2px 2px 0 var(--encre); }
  .fiche .texte { padding: 16px 18px 20px; font-size: 17px; line-height: 1.5; }
  .fiche .texte p { margin: 0 0 12px; max-width: 34em; }
  .fiche h2 { font-family: "Bowlby One", "Arial Black", Impact, sans-serif; font-weight: 400; font-size: 30px; margin: 0 0 2px; line-height: 1.02; color: var(--encre); text-shadow: 2px 2px 0 var(--rose); }
  .fiche h3 { font-family: "Bowlby One", "Arial Black", Impact, sans-serif; font-weight: 400; font-size: 17px; margin: 14px 0 4px; }
  .fiche .sous { color: var(--encre-douce); font-size: 15px; font-style: italic; margin-bottom: 12px; }
  .fiche .faits { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 12px; }
  .fiche .fait { background: var(--encre); color: var(--papier); border-radius: 2px; padding: 4px 10px; font-size: 14px; font-weight: 700; }
  .fiche .liste button { display: block; width: 100%; text-align: left; margin: 8px 0; }
  .fiche .choix { margin-top: 14px; }
  .fiche .choix button { display: block; width: 100%; text-align: left; margin: 10px 0; padding: 12px 15px; font-size: 17px; line-height: 1.3; }
  .fiche .journal { border-left: 2px solid var(--orange); padding-left: 12px; margin: 12px 0; color: var(--encre-douce); font-style: italic; font-size: 16px; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0 12px; font-size: 15px; }
  th { text-align: left; font-size: 14px; font-style: italic; font-weight: 400; color: var(--encre-douce); padding: 4px 6px; border-bottom: 1.5px solid var(--encre); }
  td { padding: 6px; border-bottom: 1px solid rgba(27,36,81,0.18); vertical-align: top; }
  .gris { color: var(--encre-douce); font-size: 14px; font-style: italic; }
  /* la soute */
  .grille { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px 9px; margin: 12px 0; touch-action: none; }
  .colonne { font-family: "Bowlby One", "Arial Black", Impact, sans-serif; font-size: 12px; text-align: center; padding: 4px 2px 3px; border: 1.5px solid var(--encre); border-radius: 3px; line-height: 1.1; }
  .case { aspect-ratio: 1; background: rgba(27,36,81,0.05); border: 1.5px dashed rgba(27,36,81,0.3); border-radius: 3px; display: flex; align-items: center; justify-content: center; }
  .tuile { width: 86%; height: 86%; border: 1.5px solid var(--encre); border-radius: 3px; box-shadow: 2px 2px 0 var(--encre); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--encre); cursor: grab; transition: transform 0.15s; position: relative; }
  .tuile span { font-family: "Bowlby One", "Arial Black", Impact, sans-serif; font-size: 20px; line-height: 1; }
  .tuile small { font-size: 9px; letter-spacing: 1px; margin-top: 3px; }
  .gain { position: fixed; left: 18px; font: 700 16px "Vollkorn", serif; color: var(--eau); pointer-events: none; animation: monte 1.4s ease-out forwards; }
  @keyframes monte { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-30px); } }
  input { font: 400 18px "Vollkorn", Georgia, serif; padding: 10px 12px; border: 1.5px solid var(--encre); border-radius: 3px; width: 100%; box-sizing: border-box; background: #fbf3dc; color: var(--encre); }
  @media (prefers-reduced-motion: reduce) { .tuile, button { transition: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="fiche cache" id="fiche"><div class="page" id="page"></div></div>
<header class="hud">
  <div class="identite">
    <div class="marque"><span data-ico="fusee"></span>Parsec &amp; Co</div>
    <div class="nom" id="nomJ">…</div>
    <div class="titre"><span data-ico="etoile"></span><span id="titreJ"></span></div>
  </div>
  <div class="xp"><i id="xpBar" style="width:0%"></i></div>
  <div class="releve">
    <div><span id="nbCol"></span> <span data-ico="boussole"></span><b id="dist">…</b> al du centre</div>
    <div class="echelle"><i id="barre"></i><span id="txtEchelle"></span></div>
  </div>
  <nav class="onglets" aria-label="Menus">
    <button id="btnSoute" type="button">Soute</button>
    <button id="btnGuide" type="button">Guide</button>
    <button id="btnVoir" type="button"><span data-ico="galaxie"></span>Galaxie</button>
  </nav>
</header>
<div class="bas">
  <div class="papier" id="papier"></div>
  <button class="ping action" id="btnPing" type="button"><span data-ico="antenne"></span>Scruter le vide</button>
</div>

<script>
(() => {
  // ===================== Symboles, à l’encre, en ligne claire =====================
  const ICO = {
    fusee: "M12 3c3 2 4 6 3 10l-3 3-3-3c-1-4 0-8 3-10z M9 13l-3 2 1 3 2-2 M15 13l3 2-1 3-2-2 M12 8.5v.5",
    etoile: "M12 3.5l2.5 5.3 5.8.7-4.3 4 1.1 5.7L12 16.4l-5.1 2.8 1.1-5.7-4.3-4 5.8-.7z",
    planete: "M7 12a5 5 0 1 0 10 0a5 5 0 1 0-10 0 M3 15.5c2 2 16-1.5 18-6.5",
    caisse: "M4 9h16v11H4z M3 5h18v4H3z M10 13h4",
    boussole: "M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18 M15.5 8.5l-2 5-5 2 2-5z",
    livre: "M3 6c3-1.5 6-1.5 9 1v12c-3-2.5-6-2.5-9-1z M21 6c-3-1.5-6-1.5-9 1v12c3-2.5 6-2.5 9-1z",
    galaxie: "M12 12a1.4 1.4 0 1 1 1.4 1.4 M13.4 13.4a3 3 0 1 1-3-4.4 M10.4 9a4.6 4.6 0 1 1 5.6 6.7 M16 15.7a6.4 6.4 0 1 1-9.5-9.2",
    maison: "M4 11l8-6.5 8 6.5 M6 9.5V20h12V9.5 M10 20v-5h4v5",
    antenne: "M6 18l3-3 M4.5 9.5a9 9 0 0 0 10 10z M10 14l3.5-3.5 M15 7a3.5 3.5 0 0 1 2 2 M15.5 3.5a7 7 0 0 1 5 5",
    viseur: "M12 3v4 M12 17v4 M3 12h4 M17 12h4 M7 12a5 5 0 1 0 10 0a5 5 0 1 0-10 0",
    lune: "M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z",
    danger: "M12 4l9 16H3z M12 10v4.5 M12 17.5v.5",
    epaves: "M9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0 M12 3v3 M12 18v3 M3 12h3 M18 12h3 M5.6 5.6l2.1 2.1 M16.3 16.3l2.1 2.1 M5.6 18.4l2.1-2.1 M16.3 7.7l2.1-2.1",
    fossiles: "M5 19C8 9 13.5 5 19 5c0 5.5-4 11.5-14 14z M5 19l8.5-8.5 M10 14l-1-3.5 M12.5 11.5l3 .5",
    reliques: "M3.5 9.5h17 M12 4l8.5 5.5h-17z M6 9.5v8 M10 9.5v8 M14 9.5v8 M18 9.5v8 M3.5 19.5h17",
    bizarreries: "M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12z M9.5 12a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0"
  };
  function ico(n) { return "<svg class=\"ico\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"" + ICO[n] + "\"/></svg>"; }
  document.querySelectorAll("[data-ico]").forEach(el => { el.outerHTML = ico(el.dataset.ico); });
  // ===================== Formule de la galaxie =====================
  function hash(a, b, c, d) {
    let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 2246822519) + Math.imul(d | 0, 3266489917)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  const R_MAX = 55000;
  function densite(x, y) {
    const r = Math.hypot(x, y); if (r > R_MAX) return 0;
    const t = Math.atan2(y, x), spirale = Math.log(Math.max(r, 300) / 300) / 0.26;
    let bras = 0.5 + 0.5 * Math.cos(2 * (t - spirale)); bras = Math.pow(bras, 2.2);
    const disque = Math.exp(-r / 8500) * (0.28 + 0.72 * bras), bulbe = 2.2 * Math.exp(-r / 1300);
    const bord = r > 45000 ? Math.exp(-(r - 45000) / 3000) : 1;
    return (disque + bulbe) * bord;
  }
  const SYL1 = ["Vor", "Tal", "Mé", "Kol", "Ambre", "Oli", "Zé", "Bru", "Fal", "Nim", "Quar", "Sol", "Vel", "Tru", "Pal", "Ygg", "Hou", "Bis", "Cal", "Dro"];
  const SYL2 = ["bek", "mira", "thon", "dune", "lune", "quin", "ros", "van", "pax", "lo", "ste", "nar", "kou", "min", "ba", "ren", "cotte", "pic", "tane", "ule"];
  const SUFF = ["", "", "", " Majeure", " Mineure", "-3", "-7", " Prime", " la Verte", " du Bas", " Nord", "-II", " l’Oubliée", " Bis"];
  function nomDe(a, b, c) { return SYL1[Math.floor(hash(a, b, c, 11) * SYL1.length)] + SYL2[Math.floor(hash(a, b, c, 12) * SYL2.length)] + SUFF[Math.floor(hash(a, b, c, 13) * SUFF.length)]; }

  const TAILLE_0 = 14, L_BROUILLARD = 4;
  const COULEURS = ["#f4e9cf", "#f4e9cf", "#f4e9cf", "#8fd3c4", "#b9aae8", "#ef9b4f"];
  let seed;
  function etoilesCellule(L, i, j) {
    const s = TAILLE_0 * Math.pow(2, L), dCell = densite((i + 0.5) * s, (j + 0.5) * s);
    if (dCell <= 0) return [];
    const attendu = dCell * 1.6 * Math.pow(2, Math.max(0, 4 - L));
    const n = Math.min(14, Math.floor(attendu) + (hash(i, j, L, seed) < attendu % 1 ? 1 : 0));
    const out = [];
    for (let k = 0; k < n; k++) out.push({
      id: L + ":" + i + ":" + j + ":" + k,
      x: (i + hash(i, j, L * 4 + k, seed + 1)) * s, y: (j + hash(i, j, L * 4 + k, seed + 2)) * s,
      b: hash(i, j, L * 4 + k, seed + 3), c: COULEURS[Math.floor(hash(i, j, L * 4 + k, seed + 4) * COULEURS.length)],
      nom: nomDe(i * 7 + k, j * 13 + L, seed)
    });
    return out;
  }
  const UA = 1 / 63241;
  const COULEURS_PLANETES = ["#ef9b4f", "#8fd3c4", "#b9aae8", "#f4e9cf", "#e08a7a", "#c9d99a", "#9fb4e8"];
  function planetesDe(e) {
    const g = e.id ? e.id.length * 31 + e.id.charCodeAt(0) : 1;
    const h = (a, b) => hash(Math.round(e.x * 1000), Math.round(e.y * 1000) + a, b, g);
    const n = 1 + Math.floor(h(0, 1) * 7), out = [];
    for (let k = 0; k < n; k++) out.push({ a: 0.35 * Math.pow(1.8, k) * (0.8 + 0.4 * h(k, 2)), r: 1.6 + 3.2 * h(k, 3), phase: h(k, 4) * Math.PI * 2, c: COULEURS_PLANETES[Math.floor(h(k, 5) * COULEURS_PLANETES.length)] });
    return out;
  }
  function tirerDepart(seed) {
    for (let k = 0; k < 400; k++) {
      const r = 3000 + hash(seed, k, 1, 5) * 42000, t = hash(seed, k, 2, 5) * Math.PI * 2, x = r * Math.cos(t), y = r * Math.sin(t);
      if (hash(seed, k, 3, 5) < densite(x, y)) return { x, y, nom: nomDe(seed, 1, 2) };
    }
    return { x: 26000, y: 0, nom: nomDe(seed, 1, 2) };
  }

  // ===================== Sauvegarde et état =====================
  function charger(cle, defaut) { try { const v = localStorage.getItem(cle); return v === null ? defaut : JSON.parse(v); } catch (e) { return defaut; } }
  function sauver(cle, v) { try { localStorage.setItem(cle, JSON.stringify(v)); } catch (e) {} }
  seed = charger("parsec.seed", null);
  if (!Number.isFinite(seed)) { seed = Math.floor(Math.random() * 1e9); sauver("parsec.seed", seed); }
  const home = tirerDepart(seed);
  const decouverts = new Map(); for (const e of charger("parsec.decouverts", [])) decouverts.set(e.id, e);
  const explores = new Map(); for (const m of charger("parsec.explores", [])) explores.set(m.id, m);
  // tout ce que tu explores est un comptoir de la Compagnie : il écoute, les navettes y passent
  const colonies = new Map();
  function majComptoirs() { colonies.clear(); colonies.set("home", { id: "home", nom: home.nom, x: home.x, y: home.y }); for (const m of explores.values()) if (m.vu) colonies.set(m.id, { id: m.id, nom: m.nom, x: m.x, y: m.y }); }
  majComptoirs();
  let joueur = charger("parsec.joueur", null) || { nom: "", xp: 0 };
  if (!joueur.xp) joueur.xp = 0;
  const vieux = charger("parsec.equipage", null); if (vieux && vieux.length && !joueur.nom) { joueur.nom = vieux[0].nom; joueur.xp = vieux[0].xp || 0; }
  let soute = charger("parsec.soute", null);
  if (!soute) { soute = []; for (const m of explores.values()) if (m.artefact) soute.push({ id: "art-" + m.id, nom: m.artefact.texte, tag: "artefact", serie: m.artefact.serieNom, de: m.nom, usage: "objet" }); sauver("parsec.soute", soute); }
  const VITESSE = 20000, PORTEE = 160;
  let vol = charger("parsec.vol", null);             // { versId, deX, deY, t0, t1 } : ton vaisseau en route
  if (!vol) { const anc = charger("parsec.explorateurs", []); if (anc.length) { vol = anc[0]; sauver("parsec.vol", vol); } }
  let blesse = charger("parsec.blesse", 0);          // horodatage de fin de convalescence

  const VITESSE2 = 20000;
  const vue = { cx: home.x, cy: home.y, lpp: 0.25 };
  const LPP_MIN = 0.0000025, LPP_MAX = 420;
  const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  let W = 0, H = 0, dpr = 1;

  // ===================== Toi : niveau et titre =====================
  const PALIERS = [0, 3, 8, 15, 25, 40, 60, 90, 130, 200];
  const TITRES = ["Stagiaire du Vide", "Touriste Assermenté", "Arpenteur Approximatif", "Cartographe Malgré Lui", "Dompteur de Cailloux", "Inspecteur des Horizons", "Vétéran Fêlé", "Légende Locale (très locale)", "Grand Explorateur, selon lui-même", "Monument Interstellaire Classé"];
  function niveau() { let n = 0; while (n + 1 < PALIERS.length && joueur.xp >= PALIERS[n + 1]) n++; return n; }
  function titre() { return TITRES[niveau()]; }
  function facteurVitesse() { return 1 + 0.15 * niveau(); }
  function gagnerXp(n) { const avant = niveau(); joueur.xp += n; sauver("parsec.joueur", joueur); majHud(); if (niveau() > avant) { carillon(); dire("<b>Promotion.</b> " + joueur.nom + " est désormais <b>" + titre() + "</b>. La Compagnie n’a pas de budget pour une médaille, mais elle y a pensé."); } }
  function majHud() {
    document.getElementById("nomJ").textContent = joueur.nom || "…";
    document.getElementById("titreJ").textContent = titre() + ", niveau " + (niveau() + 1);
    const n = niveau(), a = PALIERS[n], b = PALIERS[Math.min(n + 1, PALIERS.length - 1)];
    document.getElementById("xpBar").style.width = (b > a ? Math.min(100, (joueur.xp - a) / (b - a) * 100) : 100) + "%";
    let best = Infinity; for (const c of colonies.values()) best = Math.min(best, Math.hypot(c.x, c.y));
    document.getElementById("dist").textContent = fmt(best);
    document.getElementById("nbCol").innerHTML = ico("planete") + "<span>" + explores.size + "</span> monde" + (explores.size > 1 ? "s" : "") + " " + ico("caisse") + "<span>" + soute.length + "</span> objet" + (soute.length > 1 ? "s" : "");
    document.getElementById("btnSoute").innerHTML = ico("caisse") + "Soute" + (soute.length ? "<span class=\"pastille\">" + soute.length + "</span>" : "");
    document.getElementById("btnGuide").innerHTML = ico("livre") + "Guide" + (explores.size ? "<span class=\"pastille\">" + explores.size + "</span>" : "");
  }

  const TYPE = Object.fromEntries(TYPES.map(t => [t.k, t]));
  const POIDS_TOTAL = TYPES.reduce((s, t) => s + t.poids, 0);
  const OUVERTURES = ["Le Guide dit :", "D’après le Guide,", "Le Guide, sobrement :", "Extrait du Guide, page 4 081 :", "Le Guide note, sans s’émouvoir :"];
  function genererMonde(e) {
    const h = (a) => hash(Math.round(e.x * 1000), Math.round(e.y * 1000), a, seed + 99);
    let tirage = h(1) * POIDS_TOTAL, type = TYPES[0];
    for (const t of TYPES) { tirage -= t.poids; if (tirage <= 0) { type = t; break; } }
    const danger = type.danger[0] + Math.floor(h(2) * (type.danger[1] - type.danger[0] + 1));
    return { id: e.id, nom: e.nom, x: e.x, y: e.y, d: e.d, type: type.k, titre: type.nom, danger, c1: type.c1, c2: type.c2,
      texte: OUVERTURES[Math.floor(h(3) * OUVERTURES.length)] + " " + e.nom + ", c’est " + type.desc[Math.floor(h(4) * type.desc.length)] + ".", trouve: Date.now(), journal: [] };
  }
  // la soute : objets trouvés + équipement fourni par les colonies
  // les outils : le premier monde d’un type que tu as traversé t’a appris à t’équiper
  function equipementColonies() { return []; }   // plus d’outils : une seule chose en soute, les objets des quatre séries
  function touteLaSoute() { return [...equipementColonies(), ...soute]; }

  const TROUVAILLES = {

    bizarreries: ["un caillou qui pèse plus lourd quand on le regarde", "une flaque qui reflète hier", "un son, conservé dans un bocal", "une ombre sans propriétaire, en bon état"]
  };
  const SERIE_NOM = { epaves: "Épaves", fossiles: "Fossiles", reliques: "Reliques", bizarreries: "Bizarreries" };
  // les paliers de fusion : deux objets identiques font l’objet du palier suivant
  const PALIERS_OBJ = {
    epaves: ["un boulon d’épave", "un rouage encore gras", "un mécanisme qui tourne tout seul", "un moteur d’épave, chaud", "un cœur de vaisseau qui bat"],
    fossiles: ["une écaille fossile", "un os creux qui siffle", "un crâne à trois orbites", "un squelette replié dans une boîte", "un fossile qui respire encore"],
    reliques: ["un tesson gravé", "une pièce qui dit « pile » des deux côtés", "un sceau d’une administration éteinte", "une couronne pour une tête étrange", "un trône portatif, pliant"],
    bizarreries: ["une lueur dans un bocal", "un murmure en boucle", "un petit paradoxe de poche", "un petit miracle, périmé bientôt", "une chose indescriptible, mais polie"]
  };
  function objetPalier(serie, palier) { return { nom: PALIERS_OBJ[serie][Math.min(palier, 4) - 1], serie, serieNom: SERIE_NOM[serie], palier }; }
  function fusionner(serie, palier) {
    const memes = soute.filter(o => o.serie === serie && (o.palier || 1) === palier);
    if (memes.length < 2 || palier >= 5) return false;
    soute = soute.filter(o => o !== memes[0] && o !== memes[1]);
    const n = objetPalier(serie, palier + 1);
    soute.push({ id: "fus-" + Date.now() + "-" + Math.floor(Math.random() * 1e6), nom: n.nom, tag: "artefact", serie, serieNom: n.serieNom, palier: palier + 1, de: "fusion", usage: "objet" });
    sauver("parsec.soute", soute); carillon(); majHud(); return true;
  }
  // migration des anciennes trouvailles vers des objets de palier 1
  for (const o of soute) { if (!o.palier) { const s = Object.keys(SERIE_NOM).find(k => SERIE_NOM[k] === o.serie) || "bizarreries"; o.serie = s; o.serieNom = SERIE_NOM[s]; o.palier = 1; o.nom = PALIERS_OBJ[s][0]; } }
  sauver("parsec.soute", soute);
  const SCENES = /* scènes : t (texte), a (prudent), b (audacieux : réussite/échec), o ([série, texte si on sort un objet de cette série]) */
  {"rocheux":[{"t":"Une faille coupe la plaine en deux. Au fond, quelque chose renvoie la lumière de ta lampe, et ce n’est pas de la roche.","a":["Noter la position et contourner","Tu notes. Le Guide gagne une ligne, toi une heure de marche. La faille garde son secret."],"b":["Descendre en rappel","Trente mètres plus bas, coincé entre deux blocs : {trouvaille}. Tu remontes avec, et avec un sourire idiot.","Le rocher où tu as ancré la corde a d’autres projets. Tu descends plus vite que prévu."],"o":["epaves","Tu bricoles un treuil avec. Trente mètres plus bas, sans risque : {trouvaille}."]},{"t":"Un vent sec pousse des galets qui roulent tous dans la même direction, vers un col. Tu n’as jamais vu des cailloux avoir une destination.","a":["Suivre les galets de loin","Ils se rassemblent en un tas au col. Un tas, c’est tout. Mais tu as marché avec eux, et c’était bien."],"b":["Grimper au col avant eux","Au col, le vent t’offre une vue sur trois vallées et, calé dans une fissure, {trouvaille}.","Un galet plus gros que les autres te prend la cheville en passant. Il avait l’air pressé."],"o":["bizarreries","Tu le poses au sol : les galets s’arrêtent net, comme gênés. L’un d’eux n’est pas un galet : {trouvaille}."]},{"t":"Une grotte respire. Vraiment : un souffle tiède qui entre et qui sort, toutes les dix secondes.","a":["Rester à l’entrée et écouter","Le souffle est régulier, rassurant, comme un animal qui dort. Tu repars sur la pointe des pieds."],"b":["Entrer entre deux souffles","La grotte est un ancien conduit, lisse, et au bout, posé là : {trouvaille}. Le souffle s’arrête une seconde quand tu le prends.","Tu entres au mauvais moment. Le souffle te recrache. Tu atterris mal."],"o":["fossiles","Tu le présentes à l’entrée. Le souffle s’arrête, poli. Au fond : {trouvaille}, et un peu de honte."]}],"gazeux":[{"t":"Tu tombes dans les nuages sans fin. Un éclair horizontal passe à côté de toi et continue sa route sur mille kilomètres.","a":["Rester haut, observer","Tu comptes les éclairs. Le Guide note : « orage permanent, lumineux, pas cher ». Tu n’as rien ramené que la vue."],"b":["Plonger sous la couche","Sous les nuages, une plateforme dérive, vide, ancienne. Dessus : {trouvaille}. Tu remontes avant que le vent ne la reprenne.","La pression te rappelle qu’elle existe. Le vaisseau grince, toi aussi."],"o":["bizarreries","Il flotte tout seul ; tu t’y accroches et tu descends sans effort. Sur une plateforme perdue : {trouvaille}."]},{"t":"Quelque chose de vivant nage dans les nuages : grand, lent, translucide, et manifestement pas intéressé par toi.","a":["Le filmer de loin","Il ondule, il disparaît. Le Guide le baptise « la chose polie ». Tu as une vidéo floue et un souvenir net."],"b":["T’approcher","Il te laisse venir, et quand tu es tout près, il lâche quelque chose qui tombe lentement : {trouvaille}. Un cadeau, ou un déchet. Le Guide hésite.","Il te frôle. Tu apprends que « translucide » ne veut pas dire « léger »."],"o":["fossiles","La chose polie le renifle, le reconnaît, et dépose {trouvaille} à côté de toi, lentement."]},{"t":"Une tempête de la taille d’un continent se forme devant toi. Elle a un œil, et l’œil est calme.","a":["Contourner","Trois heures de détour. Tu regardes l’œil de loin. Il te regarde aussi, probablement."],"b":["Traverser par l’œil","Dans l’œil, le silence. Et un nuage de débris en orbite : {trouvaille} flotte à portée de bras.","La paroi de l’œil bouge plus vite que les cartes. Tu ressors secoué, et pas du bon côté."],"o":["bizarreries","Il vibre vers l’œil de la tempête, et t’y guide. Au centre, en apesanteur : {trouvaille}."]}],"desert":[{"t":"Une ligne droite traverse les dunes sur des kilomètres. Trop droite pour être naturelle, trop longue pour être utile.","a":["La longer un moment","Elle ne mène nulle part de visible. Le Guide note : « quelqu’un avait un plan ». Tu rentres avant la nuit."],"b":["Creuser au milieu","À un mètre, du métal. À deux, {trouvaille}. La ligne était une route, et tu viens d’en voler un morceau.","Le sable glisse dans le trou plus vite que tu ne creuses. Tu t’en sors couvert et vexé."],"o":["epaves","Il bipe sur la ligne. Tu creuses au bon endroit, une fois : {trouvaille}."]},{"t":"Un mirage ne disparaît pas quand tu t’approches. C’est une oasis, avec de l’eau noire et un seul arbre.","a":["Remplir une gourde et repartir","L’eau est froide, bonne, et un peu trop calme. Tu n’as pas attendu de voir si l’arbre bougeait."],"b":["Passer la nuit sous l’arbre","À l’aube, l’arbre a laissé tomber {trouvaille} à côté de toi. Ou tu l’as rêvé. Il est dans la soute, donc non.","Tu te réveilles à cent mètres de l’oasis, sans savoir comment. Quelque chose a préféré que tu dormes ailleurs."],"o":["fossiles","Tu le trempes dans l’eau noire. Elle frémit, et recrache {trouvaille} à minuit pile."]},{"t":"Le sable chante quand tu marches dessus, une note différente à chaque pas. Tu te surprends à composer.","a":["Enregistrer la mélodie","Le Guide a maintenant une bande-son. Elle est bizarre. Tu l’écoutes trois fois."],"b":["Jouer la mélodie à l’envers","Le sable s’affaisse sur dix mètres et découvre une dalle. Sous la dalle : {trouvaille}. La musique, c’était un mot de passe.","Le sable n’aime pas ta version. Il te le fait savoir en se dérobant sous tes pieds."],"o":["bizarreries","Il reprend la mélodie du sable, à l’envers. La dune s’ouvre sur {trouvaille}."]}],"glace":[{"t":"Sous la glace, à trois mètres, une forme sombre, grande comme une maison. Elle n’a pas bougé depuis que tu regardes. Tu regardes depuis longtemps.","a":["Mesurer, photographier, partir","Le Guide gagne un croquis. La forme gagne un visiteur. Vous êtes quittes."],"b":["Creuser jusqu’à elle","La glace cède sur une coque. Dans une ouverture : {trouvaille}, gelé, intact, et presque tiède.","La glace cède, mais sous toi. L’eau est à moins deux. Tu ressors en claquant des dents et des mots."],"o":["epaves","Tu le branches sur la coque enfouie ; une trappe s’ouvre d’elle-même : {trouvaille}, tiède."]},{"t":"Des colonnes de glace, des centaines, alignées. Le vent y souffle une note grave qui te fait vibrer les dents.","a":["Traverser en silence","La note t’accompagne jusqu’au bout. De l’autre côté, le silence est si soudain qu’il fait mal."],"b":["Frapper une colonne","Elle sonne, les autres répondent, et l’une d’elles se fend : {trouvaille} tombe à tes pieds, enfermé depuis des âges.","Elle sonne, les autres répondent, et le sol aussi. Tu cours. Tu ne cours pas assez vite."],"o":["fossiles","Tu le frappes doucement contre une colonne. Elle répond, se fend, et libère {trouvaille}."]},{"t":"Une lumière bleue bouge sous la banquise, lente, comme quelqu’un qui cherche ses clefs.","a":["La suivre à distance","Elle tourne en rond, puis s’éteint. Tu notes : « cherche encore ». Tu rentres avec les mains froides et vides."],"b":["Percer un trou au-dessus d’elle","La lumière monte vers le trou, curieuse, et dépose {trouvaille} sur la glace avant de replonger. Un échange, sans mot.","La lumière monte trop vite. La glace éclate autour du trou, et toi avec elle, un peu."],"o":["bizarreries","La lumière bleue le voit, approche, hésite, laisse {trouvaille} sur la glace, repart."]}],"volcan":[{"t":"Un lac de lave respire à cent mètres. Sur une île au milieu, quelque chose brille qui n’est pas de la lave.","a":["Observer depuis la rive","Tu attends qu’une bulle éclate. Elle éclate. Le Guide note : « joli, mortel, pas de parking »."],"b":["Sauter d’îlot en îlot","Tu arrives sur l’île, tu attrapes {trouvaille}, tu reviens, et tu ne regardes tes semelles que plus tard. Elles ont fondu.","Le troisième îlot n’était pas un îlot. Tu te sauves par miracle, et pas entier."],"o":["epaves","Tu t’en sers d’écran : la chaleur glisse dessus. Tu traverses jusqu’à l’île : {trouvaille}."]},{"t":"Une cheminée éteinte, large comme un puits. Une corde y pend, très vieille, attachée à rien de visible.","a":["Tirer sur la corde","Elle remonte, dix mètres, puis se détache. Au bout, un nœud marin. Quelqu’un est descendu un jour. Tu n’es pas quelqu’un."],"b":["Descendre dans la cheminée","À mi-hauteur, une niche creusée à la main : {trouvaille}, et une inscription qui dit « enfin ». Tu remontes avant de comprendre.","La cheminée n’était pas si éteinte. Tu remontes rapidement, avec une odeur de poil roussi."],"o":["reliques","Dans la niche, un socle à sa forme exacte. Tu le poses : la paroi s’ouvre sur {trouvaille}."]},{"t":"Le sol est tiède, et il bat. Un battement lent, profond, qu’on sent dans les genoux.","a":["Repartir vers le vaisseau","Tu marches sans courir. Le battement te suit jusqu’à la porte. Puis s’arrête. Puis tu décolles."],"b":["Poser l’oreille au sol","Tu entends un rythme, puis un autre dessous, puis tu sens sous ta main {trouvaille}, chaud, remonté par une fissure. Le monde te l’a donné.","Le sol bat plus fort, et s’ouvre. Pas beaucoup. Assez."],"o":["bizarreries","Il bat au même rythme que le sol. La fissure s’ouvre juste assez : {trouvaille}, chaud."]}],"toxique":[{"t":"Un lac jaune, parfaitement immobile. Au bord, des traces de pas qui y entrent. Aucune qui en sort.","a":["Ne pas s’approcher","Le Guide gagne une mise en garde très claire. Tu gagnes le droit de respirer encore."],"b":["Suivre les traces jusqu’au bord","Au bord, sous une croûte de sel : {trouvaille}, laissé là par quelqu’un qui n’avait plus besoin de rien. Tu ne demandes pas.","La rive est molle. Ton pied y plonge, et l’acide ne plaisante pas."],"o":["epaves","Il filtre l’air et l’acide. Tu marches dans le lac jusqu’à la taille : au fond, {trouvaille}."]},{"t":"Des bulles remontent d’une mare et éclatent en formant des mots. Des vrais mots. Dans ta langue.","a":["Lire, ne pas répondre","Les mots disent « encore », puis « merci », puis plus rien. Tu repars troublé et prudent."],"b":["Répondre à voix haute","Les bulles changent de rythme, et la mare recrache {trouvaille}, propre, comme une réponse. Le Guide refuse de commenter.","Les bulles éclatent toutes en même temps. Le nuage te prend. Tu tousses pendant des heures."],"o":["reliques","Les bulles le reconnaissent et s’excusent en vieille langue. La mare te rend {trouvaille}, « emprunté »."]},{"t":"Une pluie verte commence. Elle grésille sur le vaisseau, et le vaisseau n’aime pas ça.","a":["Rentrer et décoller","Tu décolles sous la pluie. Le Guide note : « pluie corrosive, voir ailleurs ». La coque a des taches."],"b":["Attendre sous un surplomb","La pluie révèle, en rongeant le sol, {trouvaille}, enterré là depuis toujours. Tu le ramasses entre deux gouttes.","Le surplomb fond. Tout fond ici. Tu cours jusqu’au vaisseau, moins entier qu’à l’aller."],"o":["fossiles","Tu l’exposes à la pluie verte : il l’absorbe. Tu te promènes sous l’averse et ramasses {trouvaille}."]}],"crateres":[{"t":"Un cratère parfait, trop parfait. Au centre, un point noir. Tu te dis que c’est un rocher. Il n’a pas l’ombre d’un rocher.","a":["Faire le tour du bord","Tu fais le tour. Le point noir reste au centre, quel que soit l’angle. Le Guide note : « non »."],"b":["Marcher jusqu’au centre","Le point noir est un trou, et dans le trou, posé sur une marche : {trouvaille}. Quelqu’un voulait qu’on le trouve.","Le trou est plus proche que prévu. Et plus profond."],"o":["epaves","Il bipe vers le centre, mais s’arrête à vingt mètres : {trouvaille} est juste là, sous la poussière."]},{"t":"La poussière garde une seule empreinte, énorme, à trois orteils. Une seule. Comme si quelque chose avait sauté.","a":["Mesurer l’empreinte","Deux mètres. Le Guide propose plusieurs explications, toutes désagréables. Tu repars sans vérifier."],"b":["Chercher l’atterrissage","Trois kilomètres plus loin, une seconde empreinte, et dedans : {trouvaille}, écrasé mais entier. Tu ne cherches pas la troisième.","Tu la trouves. Elle est fraîche."],"o":["fossiles","Tu le poses dans l’empreinte. Elle se referme doucement sur lui, et te laisse {trouvaille} en échange."]},{"t":"Un vieux module repose sur le flanc, à moitié enterré. Son antenne tourne encore, très lentement.","a":["Lire la plaque","Une langue inconnue, un chiffre immense. Le Guide traduit : « ici, un jour ». Tu notes, tu salues, tu repars."],"b":["Ouvrir la trappe","Dedans, tout est mort, sauf une boîte, qui s’ouvre : {trouvaille}. L’antenne s’arrête. Il attendait ça.","La trappe cède d’un coup. Toi aussi, sous elle."],"o":["reliques","La trappe porte un sceau de la même main. Elle s’ouvre : {trouvaille}, et l’antenne s’arrête."]}],"ocean":[{"t":"La mer est plate, immense, et sous ta coque passe une ombre plus longue que ton vaisseau n’est long.","a":["Rester en surface","L’ombre passe deux fois, puis s’en va. Le Guide note : « habité, sous l’eau, à ne pas déranger »."],"b":["Plonger derrière elle","L’ombre te mène à une fosse, et dans la fosse, coincé dans le corail : {trouvaille}. Elle t’attendait là, ou attendait quelqu’un.","L’ombre se retourne. Elle a une bouche. Tu remontes vite, pas assez."],"o":["bizarreries","Il brille sous l’eau. L’ombre le suit comme un chien, et te mène à {trouvaille}."]},{"t":"Une île flotte. Pas posée : flottante, et elle dérive vers toi.","a":["La laisser passer","Elle passe, lente, couverte d’herbes. Quelque chose y chante. Tu notes la chanson."],"b":["Y débarquer","L’île est un animal, très vieux, très doux, et sur son dos : {trouvaille}, enfoncé dans la mousse. Tu le prends ; il soupire.","L’île plonge quand tu poses le pied. Tu nages. Longtemps."],"o":["fossiles","Tu le déposes sur le dos de l’île. Elle soupire, s’arrête, et te laisse prendre {trouvaille}."]},{"t":"Le plancton s’allume à la nuit tombée et dessine des lettres. Elles forment un mot. Tu le lis. Tu préfères ne pas l’avoir lu.","a":["Éteindre les lumières et attendre l’aube","Au matin, plus rien. Le mot est dans ta tête, et dans le Guide, en tout petit."],"b":["Écrire une réponse à la rame","Le plancton répond à son tour, et la mer te rend {trouvaille}, poussé par un courant poli.","Le plancton n’aime pas ta réponse. L’eau devient très froide, très vite."],"o":["reliques","Tu le tiens au-dessus de l’eau : le plancton change de phrase, rit, et te lance {trouvaille}."]}],"jungle":[{"t":"Les arbres font cent mètres. Et au-dessus, d’autres arbres, qui poussent sur les premiers.","a":["Rester au sol","Il fait sombre, humide, et tout bouge. Tu notes trois espèces, tu en oublies deux, tu repars."],"b":["Grimper jusqu’à la seconde forêt","Là-haut, la lumière, et dans un nid immense : {trouvaille}, couvé depuis des années par rien du tout.","Une branche que tu croyais branche était un bras. Tu redescends sans l’aide de l’échelle."],"o":["fossiles","Les arbres le sentent et s’écartent d’un pas. À mi-hauteur, dans un creux : {trouvaille}."]},{"t":"Une fleur grande comme une voiture s’ouvre à ton approche. Elle sent la cannelle et la mauvaise foi.","a":["Reculer lentement","Elle se referme, déçue. Le Guide note : « carnivore probable, parfum excellent »."],"b":["Regarder dedans","Au fond du calice, dans un peu de sève : {trouvaille}, digéré à moitié mais récupérable. Tu te laves longtemps.","Elle se referme. Sur toi. Tu sors par le haut, poisseux et plus léger de quelques affaires."],"o":["bizarreries","Tu le jettes dans la fleur. Elle le goûte, frémit, s’ouvre tout grand : {trouvaille}, au fond."]},{"t":"Un sentier. Entretenu. Avec des bornes. Personne en vue, mais quelqu’un passe le balai ici.","a":["Suivre le sentier jusqu’au premier virage","Le virage mène à un autre virage. Tu renonces avec dignité. Le Guide note : « jardiniers inconnus »."],"b":["Quitter le sentier","Hors du chemin, caché exprès : {trouvaille}, sous une pierre qui n’a rien à faire là. Les jardiniers rangent mal.","Hors du chemin, la jungle est la jungle. Tu reviens au sentier avec des bouts en moins."],"o":["epaves","Il bipe sous une borne enterrée. Tu la déterres : {trouvaille}, et une borne, aussi."]}],"tempere":[{"t":"Des prairies, un ruisseau, un ciel raisonnable. Le Guide s’en méfie par principe.","a":["Pique-niquer","Le meilleur repas de ta carrière. Rien ne se passe. C’est presque inquiétant."],"b":["Suivre le ruisseau jusqu’à sa source","La source sort d’une pierre taillée, et au pied de la pierre : {trouvaille}. Quelqu’un a vécu ici, et bien.","Le ruisseau devient rivière, la rivière devient torrent. Tu rentres trempé et un peu bête."],"o":["reliques","Tu le poses sur la pierre taillée. Le ruisseau change de voix. À tes pieds : {trouvaille}."]},{"t":"Un verger. Les fruits sont mûrs, nombreux, et aucun oiseau ne les touche.","a":["Ne pas y toucher non plus","Tu as faim mais tu as lu des livres. Le Guide approuve ta culture générale."],"b":["Goûter","Sucré, parfait, et une légère sensation de voir à travers le temps. Au pied de l’arbre, tu remarques enfin {trouvaille}. Il était là depuis le début.","Sucré, parfait, puis une sieste de dix heures dont tu ne gardes rien. Au réveil, une migraine et des fourmis."],"o":["reliques","L’écriteau du verger s’adresse à lui, pas à toi : « servez-vous ». Dans le panier : {trouvaille}."]},{"t":"Une maison. Une seule. Porte ouverte, table mise, personne. Le thé est encore chaud.","a":["Rester sur le seuil","Tu attends une heure. Personne. Tu refermes la porte doucement. Le Guide note : « sortis acheter du lait »."],"b":["Entrer et s’asseoir","Tu bois le thé. Sur la chaise d’en face, quelqu’un a laissé {trouvaille}, emballé, avec un mot : « pour qui viendra ».","Tu bois le thé. Il n’était pas pour toi. Tu dors deux jours et tu te réveilles dehors."],"o":["bizarreries","Il pointe un tiroir. Dedans : {trouvaille}, et un mot : « bien joué »."]}],"etrange":[{"t":"La gravité change toutes les heures. En ce moment, elle tire vers la gauche.","a":["Attendre la prochaine bascule couché","La gravité revient au sol. Tu te relèves. Le Guide note : « prévoir des sangles ». Tu n’as rien trouvé sauf un torticolis."],"b":["Marcher sur le mur tant que ça dure","Sur le mur, qui était un sol, dans une fissure qui était une tranchée : {trouvaille}. La bascule revient. Tu redescends en volant, mal.","La bascule arrive en avance. Tu tombes sur le plafond, puis sur le sol, puis sur le mur."],"o":["bizarreries","Il flotte, insensible aux caprices de la gravité. Tu t’y accroches et tu attrapes {trouvaille} au passage."]},{"t":"Des cristaux chantent quand tu passes. Faux. Mais ils chantent ta chanson préférée, celle que tu n’as dite à personne.","a":["Passer vite","Ils finissent le refrain dans ton dos. Tu ne te retournes pas. Le Guide note : « indiscrets »."],"b":["Chanter avec eux","Ils se taisent, surpris, puis l’un d’eux s’ouvre sur {trouvaille}. Un cadeau pour le duo.","Ils chantent plus fort. Beaucoup plus fort. Tu rentres avec un acouphène et aucun trésor."],"o":["reliques","Les cristaux lisent ce qui est gravé dessus et se taisent, impressionnés. L’un d’eux s’ouvre : {trouvaille}."]},{"t":"Ton reflet dans une plaque de verre a trois secondes de retard. Il te regarde partir avant que tu ne partes.","a":["Partir sans regarder le reflet","Le reflet te regarde partir. Tu le sens. Le Guide note : « miroir en retard, à ne pas offenser »."],"b":["Attendre que le reflet fasse autre chose","Il fait autre chose : il se baisse et ramasse {trouvaille}. Tu te baisses, tu ramasses. Il y était.","Il fait autre chose : il te montre le plafond. Tu lèves les yeux. Le plafond tombe."],"o":["bizarreries","Ton reflet le voit avant toi, et te montre où chercher. Dans la plaque : {trouvaille}."]}],"habite":[{"t":"Ils sont là, tous, sur la place, à te regarder descendre. Personne ne parle. L’un d’eux tient un plateau.","a":["Saluer de loin et attendre","Ils attendent aussi. Une heure. Puis l’un d’eux hausse ce qui lui sert d’épaules et rentre dîner. Le Guide note : « patients »."],"b":["Accepter ce qu’il y a sur le plateau","C’est violet, c’est vivant, c’est bon. On t’applaudit, et on te remet {trouvaille} « pour la route », avec un petit discours.","C’était pour quelqu’un d’autre. L’incident diplomatique dure trois heures et te coûte une dent."],"o":["reliques","Tu le poses sur le plateau. Silence, puis applaudissements : la bonne réponse. On te donne {trouvaille}."]},{"t":"Un marché. Des étals, des cris, des odeurs. On te vend tout et on ne veut rien de tes mégacrédits, qui n’existent pas ici de toute façon.","a":["Regarder sans acheter","Tu regardes. On te regarde regarder. Tout le monde est content. Le Guide note : « économie à base de regards »."],"b":["Troquer un objet de ton vaisseau","Un boulon contre {trouvaille}. Le marchand est ravi, toi aussi, et quelqu’un, quelque part, vient de faire une très mauvaise affaire.","Tu troques une pièce dont tu avais besoin. Le retour au vaisseau est long et le décollage, inquiet."],"o":["epaves","Le marchand en veut, très fort. Contre {trouvaille}, et une accolade qui dure."]},{"t":"Une statue te représente. Toi. En plus grand, et avec une expression de certitude que tu n’as jamais eue.","a":["Ne rien dire","Tu passes devant comme si de rien n’était. Les habitants t’observent, puis la statue. Le Guide note : « prophétie, ou blague »."],"b":["Demander qui l’a sculptée","On te conduit à l’atelier d’un sculpteur mort il y a trois siècles. Sur son établi, {trouvaille}, et ton nom gravé dessous.","On se vexe que tu ne saches pas. On te fait comprendre, fermement, la sortie."],"o":["reliques","La statue tient le même dans sa main de pierre. Elle s’ouvre : {trouvaille}, qui t’attendait."]}]};
  function choisir(arr, h) { return arr[Math.floor(h * arr.length)]; }
  function texte(s, m, objet) {
    return s.replace(/\{nom\}/g, m.nom).replace(/\{joueur\}/g, joueur.nom).replace(/\{objet\}/g, objet ? objet.nom : "l’objet")
      .replace(/\{trouvaille\}/g, "<b>" + (m._trouvaille ? m._trouvaille.texte : "quelque chose") + "</b>");
  }
  function tirerTrouvaille(m, k) {
    const h = (a) => hash(Math.round(m.x * 1000), Math.round(m.y * 1000), a + k * 10, seed + 7);
    const series = Object.keys(TROUVAILLES), s = choisir(series, h(1)), idx = Math.floor(h(2) * TROUVAILLES[s].length);
    return { serie: s, serieNom: SERIE_NOM[s], idx, texte: TROUVAILLES[s][idx], objet: objetPalier(s, 1) };
  }
  function tirerTrouvailleAncienne(m, k) {
    const h = (a) => hash(Math.round(m.x * 1000), Math.round(m.y * 1000), a + k * 10, seed + 7);
    const series = Object.keys(TROUVAILLES), s = choisir(series, h(1)), idx = Math.floor(h(2) * TROUVAILLES[s].length);
    return { serie: s, serieNom: SERIE_NOM[s], idx, texte: TROUVAILLES[s][idx] };
  }

  // ===================== L’expédition : vivre un monde =====================
  function commencerExpedition(m) {
    if (!m.exp) {
      const h = (a) => hash(Math.round(m.x * 1000), Math.round(m.y * 1000), a, seed + 31);
      const pool = SCENES[m.type] || SCENES.rocheux;
      const ordre = pool.map((s, i) => i).sort((a, b) => h(a + 1) - h(b + 1)).slice(0, 2 + (h(9) < 0.4 ? 1 : 0));
      m.exp = { scenes: ordre, i: 0, journal: [], finie: false };
      sauver("parsec.explores", [...explores.values()]);
    }
    ouvrirExpedition(m);
  }
  function ouvrirExpedition(m) {
    const page = document.getElementById("page");
    const exp = m.exp;
    if (Date.now() < blesse && exp.i < exp.scenes.length) { fermer(); dire("<b>Convalescence.</b> " + m.nom + " attendra que tu sois sur pied, encore " + dureeTxt(blesse - Date.now()) + ". Le Guide recommande une tisane et un plaid."); return; }
    if (exp.i >= exp.scenes.length) { exp.finie = true; const neuf = !m.vu; m.vu = true; sauver("parsec.explores", [...explores.values()]); if (neuf) nouveauComptoir(m); ouvrirFiche(m, true); return; }
    const sc = (SCENES[m.type] || SCENES.rocheux)[exp.scenes[exp.i]];
    m._trouvaille = tirerTrouvaille(m, exp.i);
    let html = mast() + "<div class=\"image\"><canvas id=\"cvFiche\" width=\"520\" height=\"340\"></canvas><div class=\"manchette\">Scène " + (exp.i + 1) + " sur " + exp.scenes.length + "</div></div>";
    html += "<div class=\"texte\"><h2>" + m.nom + "</h2><div class=\"sous\">" + m.titre + ", danger " + "●".repeat(m.danger) + "○".repeat(5 - m.danger) + "</div>";
    for (const j of exp.journal) html += "<div class=\"journal\">" + j + "</div>";
    html += "<p>" + texte(sc.t, m) + "</p>";
    html += "<div class=\"choix\"><button type=\"button\" data-choix=\"a\">" + texte(sc.a[0], m) + "</button><button type=\"button\" class=\"ping\" data-choix=\"b\">" + texte(sc.b[0], m) + " <span class=\"gris\">(risqué)</span></button>";
    const objets = touteLaSoute();
    if (objets.length) html += "<button type=\"button\" class=\"second\" id=\"ouvrirSoute\">Sortir un objet de la soute…</button>";
    html += "</div><div id=\"listeSoute\"></div></div>";
    page.innerHTML = html;
    dessinerPlanete(document.getElementById("cvFiche"), m);
    document.getElementById("fiche").classList.remove("cache");
    page.querySelectorAll("button[data-choix]").forEach(b => b.addEventListener("click", () => resoudre(m, sc, b.dataset.choix, null)));
    const bs = document.getElementById("ouvrirSoute");
    if (bs) bs.addEventListener("click", () => {
      const ls = document.getElementById("listeSoute");
      const nb = objets.map(o => "<button type=\"button\" data-objet=\"" + o.id + "\">" + o.nom + " <span class=\"gris\">· " + o.serieNom + ", palier " + (o.palier || 1) + "</span></button>").join("");
      ls.innerHTML = "<p class=\"gris\">Cette scène répond à la série <b>" + SERIE_NOM[sc.o[0]] + "</b> : un objet de cette série la fait basculer. N’importe quel objet de palier 2 ou plus garantit le choix risqué. L’objet y reste.</p><div class=\"liste\">" + nb + "</div>";
      ls.querySelectorAll("button[data-objet]").forEach(b => b.addEventListener("click", () => { const o = objets.find(x => x.id === b.dataset.objet); resoudre(m, sc, "o", o); }));
    });
  }
  function resoudre(m, sc, choix, objet) {
    const exp = m.exp; let ligne = "", gagne = null, blessure = 0, xp = 1;
    if (choix === "o") {
      if (objet && sc.o && objet.serie === sc.o[0]) { soute = soute.filter(x => x.id !== objet.id); sauver("parsec.soute", soute); ligne = "<b>Tu sors " + objet.nom + ".</b> " + texte(sc.o[1], m, objet) + " <span class=\"gris\">(" + objet.nom + " y est resté.)</span>"; gagne = m._trouvaille; xp = (objet.palier || 1) >= 3 ? 4 : 2; }
      else if (objet && objet.tag === "artefact" && (objet.palier || 1) >= 2) {
        soute = soute.filter(x => x.id !== objet.id); sauver("parsec.soute", soute);
        ligne = "<b>Tu sors " + objet.nom + ".</b> " + texte(sc.b[0], m) + ", et avec ça en main, rien ne peut mal tourner. " + texte(sc.b[1], m) + " <span class=\"gris\">(" + objet.nom + " y est resté.)</span>";
        gagne = m._trouvaille; xp = (objet.palier || 1) >= 3 ? 4 : 2;
      }
      else { ligne = "<b>Tu sors " + (objet ? objet.nom : "quelque chose") + ".</b> Tu le regardes, la scène le regarde, et rien ne se passe. Tu le ranges avec dignité. Il faut quand même choisir."; exp.journal.push(ligne); sauver("parsec.explores", [...explores.values()]); ouvrirExpedition(m); return; }
    } else if (choix === "a") { ligne = "<b>" + texte(sc.a[0], m) + ".</b> " + texte(sc.a[1], m); }
    else {
      const echec = Math.random() * 100 < 12 * m.danger;
      if (echec) { ligne = "<b>" + texte(sc.b[0], m) + ".</b> " + texte(sc.b[2], m); blessure = (5 + 5 * m.danger) * 60 * 1000; xp = 1; }
      else { ligne = "<b>" + texte(sc.b[0], m) + ".</b> " + texte(sc.b[1], m); gagne = m._trouvaille; xp = 2; }
    }
    if (gagne) { const ob = gagne.objet; soute.push({ id: "art-" + m.id + "-" + exp.i + "-" + Date.now(), nom: ob.nom, tag: "artefact", serie: ob.serie, serieNom: ob.serieNom, palier: 1, de: m.nom, usage: "objet" }); sauver("parsec.soute", soute); carillon(); ligne += " <span class=\"gris\">(Dans la soute : " + ob.nom + ".)</span>"; }
    else if (blessure) { blesse = Math.max(blesse, Date.now() + blessure); sauver("parsec.blesse", blesse); bipSourd(); }
    else bip(1);
    exp.journal.push(ligne); exp.i += 1;
    gagnerXp(xp);
    sauver("parsec.explores", [...explores.values()]);
    majHud();
    if (blessure) {
      fermer(); majBlessure();
      const REPOS = [
        "Le médecin de bord, un grille-pain diplômé par correspondance, te prescrit {d} de repos et une tartine.",
        "Ton scaphandre a déposé une réclamation officielle. Délai de traitement : {d}. Tu restes allongé en attendant.",
        "La Compagnie rappelle que les blessures ne sont pas couvertes par ton contrat. Le canapé de la cabine, si. {d}.",
        "Le Guide classe l’incident dans la rubrique « ça arrive ». Repos forcé : {d}, sous plaid réglementaire.",
